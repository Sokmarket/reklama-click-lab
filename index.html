<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Reklam">
<title>Reklam</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    background: #fff;
}

body {
    overflow: hidden;
}

.reklam-link {
    display: block;
    width: 100%;
    height: 100dvh;
    margin: 0;
    padding: 0;
    cursor: pointer;
    text-decoration: none;
}

.reklam-gorsel {
    display: block;
    width: 100%;
    height: 100dvh;
    margin: 0;
    padding: 0;
    border: 0;
    object-fit: contain;
}
</style>
</head>

<body>

<a
    class="reklam-link"
    href="https://raw.githubusercontent.com/arzuoglumammad-star/reklama-click-lab/main/reklam.png"
    aria-label="Reklam görselini aç"
>
    <img
        class="reklam-gorsel"
        src="./reklam.png"
        alt="Reklam"
    >
</a>

</body>
</html>
