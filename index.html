<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b12">
<meta name="description" content="Reklama Click Lab">
<title>Reklama Click Lab</title>

<style>
:root{
  color-scheme:dark;
  --bg:#090b12;
  --card:#111522;
  --line:#252b3a;
  --text:#f5f7fb;
  --muted:#9299aa;
  --accent:#6ea8ff;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
}
body{
  padding:20px;
}
main{
  width:min(680px,100%);
  margin:0 auto;
}
header{
  padding:20px 4px 24px;
}
h1{
  margin:0 0 8px;
  font-size:28px;
}
p{
  color:var(--muted);
  line-height:1.5;
}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
  margin-bottom:14px;
}
a{
  display:flex;
  align-items:center;
  justify-content:space-between;
  min-height:58px;
  padding:15px 17px;
  margin:9px 0;
  border-radius:14px;
  border:1px solid var(--line);
  color:var(--text);
  text-decoration:none;
  background:#151a27;
  font-weight:650;
}
a:hover{
  border-color:var(--accent);
}
.small{
  font-size:13px;
  color:var(--muted);
  font-weight:400;
}
footer{
  padding:15px 4px;
  font-size:12px;
  color:var(--muted);
}
</style>
</head>

<body>
<main>

<header>
  <h1>Reklama Click Lab</h1>
  <p>GitHub Pages statik kontrol merkezi</p>
</header>

<section class="card">

<a href="./report.html">
  <span>Rapor</span>
  <span>→</span>
</a>

<a href="./health.json">
  <span>Health</span>
  <span>→</span>
</a>

<a href="./api/report.json">
  <span>Report API verisi</span>
  <span>→</span>
</a>

</section>

<section class="card">
<p class="small">
Bu GitHub Pages sürümünde Termux sunucusu, SQLite veya
MaxMind gizli anahtarı tarayıcıya gönderilmez.
</p>
</section>

<footer>
Reklama Click Lab · GitHub Pages
</footer>

</main>
</body>
</html>
