<body>

<div class="reklam-karti">

  <img
    src="https://raw.githubusercontent.com/arzuoglumammad-star/resim-public/main/resim-tikla.png"
    alt="İndirim Kuponu"
    class="reklam-gorsel">

  <a
    href="https://arzuoglumammad-star.github.io/reklama-click-lab/"
    class="indirim-kuponu">
    İndirim Kuponu
  </a>

</div>

<script>
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./sw.js")
      .catch(()=>{});
  });
}

/* =====================================================
   GÖRSELİ GÖNDER
   reklam.png + yalnızca İNDİRİM KUPONU
   ===================================================== */

async function shareImage() {
  try {
    const response = await fetch("./reklam.png", {
      cache: "no-cache"
    });

    if (!response.ok) {
      throw new Error("reklam.png yüklenemedi");
    }

    const blob = await response.blob();

    const file = new File(
      [blob],
      "reklam.png",
      {
        type: blob.type || "image/png"
      }
    );

    /* Android / WhatsApp:
       Görsel + İNDİRİM KUPONU
       URL gönderilmiyor.
    */
    if (
      navigator.share &&
      navigator.canShare &&
      navigator.canShare({ files: [file] })
    ) {
      await navigator.share({
        files: [file],
        title: "İNDİRİM KUPONU",
        text: "İNDİRİM KUPONU"
      });

      return;
    }

    /* Dosya paylaşımı desteklenmiyorsa */
    if (navigator.share) {
      await navigator.share({
        title: "İNDİRİM KUPONU",
        text: "İNDİRİM KUPONU"
      });

      return;
    }

    alert("Bu tarayıcı görsel paylaşımını desteklemiyor.");

  } catch (error) {

    if (error && error.name === "AbortError") {
      return;
    }

    console.error("Paylaşım hatası:", error);
    alert("Görsel gönderilemedi.");
  }
}

/* GÖRSELİ GÖNDER butonu varsa bağla */
const shareButton =
  document.getElementById("shareButton");

if (shareButton) {
  shareButton.addEventListener(
    "click",
    shareImage,
    { passive: false }
  );
}

/* Sağ tık / uzun basma */
document.addEventListener(
  "contextmenu",
  function(event) {
    const image =
      event.target.closest("img");

    if (!image) return;

    event.preventDefault();

    if (
      typeof openViewer === "function"
    ) {
      openViewer(event);
    }

    const menu =
      document.getElementById("shareMenu");

    if (menu) {
      menu.classList.add("open");
    }
  },
  { passive: false }
);

</script>
