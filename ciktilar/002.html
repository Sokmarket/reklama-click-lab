<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IP Analytics Report</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
padding:12px;
background:#080808;
color:#eee;
font-family:Arial,sans-serif
}
.app{max-width:760px;margin:auto}
.header{
display:flex;
justify-content:space-between;
padding:10px 3px 14px
}
.title{font-weight:800;font-size:14px}
.status{font-size:9px;color:#777}
.card{
background:#111;
border:1px solid #242424;
border-radius:13px;
overflow:hidden;
margin-bottom:8px
}
.section{
padding:10px;
background:#161616;
font-size:10px;
font-weight:800
}
.row{
display:grid;
grid-template-columns:105px 1fr;
border-top:1px solid #202020;
padding:9px;
font-size:9px
}
.label{color:#666}
.value{color:#ddd;word-break:break-word}
button{
border:1px solid #303030;
background:#151515;
color:#ddd;
border-radius:7px;
padding:9px 12px;
margin:0 5px 8px 0
}
table{
width:100%;
border-collapse:collapse;
font-size:8px
}
th,td{
padding:8px;
border-bottom:1px solid #222;
text-align:left;
vertical-align:top
}
th{color:#666}
.ok{color:#63d28b}
</style>
</head>
<body>

<div class="app">

<div class="header">
<div class="title">IP OSINT ENGINE</div>
<div class="status" id="status">Hazır</div>
</div>

<div class="card">
<div class="section">SYSTEM</div>

<div class="row">
<div class="label">Platform</div>
<div class="value">GitHub Pages</div>
</div>

<div class="row">
<div class="label">Mode</div>
<div class="value ok">Consent-based analytics</div>
</div>

<div class="row">
<div class="label">Backend</div>
<div class="value">Harici backend gerekli</div>
</div>
</div>

<div class="card">
<div class="section">FINGERPRINT</div>

<div class="row">
<div class="label">Browser</div>
<div class="value" id="browser">—</div>
</div>

<div class="row">
<div class="label">Platform</div>
<div class="value" id="platform">—</div>
</div>

<div class="row">
<div class="label">Language</div>
<div class="value" id="language">—</div>
</div>

<div class="row">
<div class="label">Screen</div>
<div class="value" id="screen">—</div>
</div>

<div class="row">
<div class="label">Viewport</div>
<div class="value" id="viewport">—</div>
</div>

<div class="row">
<div class="label">Timezone</div>
<div class="value" id="timezone">—</div>
</div>

<div class="row">
<div class="label">Touch</div>
<div class="value" id="touch">—</div>
</div>
</div>

<div class="card">
<div class="section">REPORT</div>

<div class="row">
<div class="label">REF</div>
<div class="value" id="ref">A001</div>
</div>

<div class="row">
<div class="label">Time</div>
<div class="value" id="time">—</div>
</div>
</div>

</div>

<script>
const q=new URLSearchParams(location.search);

document.getElementById("browser").textContent=navigator.userAgent;
document.getElementById("platform").textContent=navigator.platform||"N/A";
document.getElementById("language").textContent=navigator.language||"N/A";
document.getElementById("screen").textContent=screen.width+"x"+screen.height;
document.getElementById("viewport").textContent=innerWidth+"x"+innerHeight;
document.getElementById("timezone").textContent=
Intl.DateTimeFormat().resolvedOptions().timeZone||"N/A";
document.getElementById("touch").textContent=
navigator.maxTouchPoints>0?"Evet":"Hayır";
document.getElementById("ref").textContent=
q.get("ref")||"A001";
document.getElementById("time").textContent=
new Date().toLocaleString("tr-TR");
</script>

</body>
</html>
