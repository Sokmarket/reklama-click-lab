<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>HTML5 Rapor Arşivi</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:#070a10;
  color:#f5f7fa;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
}

body{
  padding:20px;
}

main{
  width:min(100%,700px);
  margin:auto;
}

header{
  background:#111722;
  border:1px solid #283244;
  border-radius:20px;
  padding:20px;
  margin-bottom:15px;
}

h1{
  margin:0;
  font-size:24px;
}

.sub{
  margin-top:7px;
  color:#8f9bad;
  font-size:13px;
}

article{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;

  background:#111722;
  border:1px solid #283244;
  border-radius:15px;
  padding:16px;
  margin-bottom:10px;
}

.number{
  font-weight:800;
}

.open{
  color:#fff;
  text-decoration:none;
  background:#202a3a;
  padding:9px 13px;
  border-radius:9px;
}
</style>
</head>

<body>

<main>

<header>
<h1>HTML5 Rapor Arşivi</h1>
<div class="sub">
Tüm raporlar numaralandırılmış şekilde saklanır.
</div>
</header>

<article>
  <div class="number">Rapor #001</div>
  <a class="open" href="./001.html">Aç</a>
</article>
<article>
  <div class="number">Rapor #002</div>
  <a class="open" href="./002.html">Aç</a>
</article>
<header>
<div class="sub">Toplam rapor: 2</div>
</header>

</main>
</body>
</html>
