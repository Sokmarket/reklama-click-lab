<!doctype html>
<html lang="tr">
<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<title>Reklam</title>

<style>

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,
body{
margin:0;
padding:0;
width:100%;
height:100%;
background:#000;
overflow:hidden;
font-family:Arial,sans-serif;
}

.page{
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
}

img{
width:100%;
height:100%;
object-fit:contain;
display:block;
}

.consent{
position:fixed;
left:12px;
right:12px;
bottom:12px;
padding:16px;
background:#151515;
border:1px solid #303030;
border-radius:14px;
color:#fff;
box-shadow:0 12px 40px rgba(0,0,0,.65);
z-index:100;
}

.consent h2{
margin:0 0 8px;
font-size:14px;
}

.consent p{
margin:0 0 12px;
font-size:11px;
line-height:1.55;
color:#aaa;
}

.buttons{
display:flex;
gap:8px;
}

button{
flex:1;
border:0;
border-radius:8px;
padding:11px;
font-size:12px;
}

.accept{
background:#fff;
color:#000;
}

.reject{
background:#292929;
color:#aaa;
}

.hidden{
display:none;
}

</style>

</head>

<body>

<div class="page">

<img
src="../reklam.png"
alt="Reklam">

</div>

<div
id="consent"
class="consent">

<h2>Gizlilik ve ziyaret analitiği</h2>

<p>
Güvenlik ve ziyaret ölçümü amacıyla bağlantı
IP adresi, ziyaret zamanı ve tarayıcı bilgisi
kaydedilebilir. Kayıt yalnızca onay vermeniz
halinde yapılır.
</p>

<div class="buttons">

<button
class="reject"
onclick="rejectTracking()">
Reddet
</button>

<button
class="accept"
onclick="acceptTracking()">
Kabul ediyorum
</button>

</div>

</div>

<script>

const params =
new URLSearchParams(
location.search
);

const ref =
params.get("ref") ||
"A001";

function hideConsent(){

document
.getElementById("consent")
.classList
.add("hidden");

}

function rejectTracking(){

localStorage.setItem(
"analytics_consent",
"0"
);

hideConsent();

}

async function acceptTracking(){

localStorage.setItem(
"analytics_consent",
"1"
);

hideConsent();

try{

const response =
await fetch(
"/track",
{
method:"POST",
headers:{
"Content-Type":
"application/json"
},
body:JSON.stringify({
consent:true,
ref:ref
})
}
);

if(!response.ok){
console.warn(
"Analitik kaydı başarısız."
);
}

}catch(error){

console.warn(
"Analitik bağlantısı başarısız:",
error
);

}

}

</script>

</body>
</html>
