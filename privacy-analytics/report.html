<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1">

<title>IP Analytics Report</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
padding:12px;
background:#080808;
color:#eee;
font-family:Arial,sans-serif;
}

.app{
max-width:760px;
margin:auto;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
padding:8px 4px 12px;
}

.title{
font-weight:bold;
font-size:14px;
}

.count{
font-size:11px;
color:#777;
}

.card{
background:#111;
border:1px solid #242424;
border-radius:12px;
overflow:hidden;
margin-bottom:8px;
}

.row{
display:grid;
grid-template-columns:100px 1fr;
border-bottom:1px solid #202020;
padding:9px;
font-size:10px;
}

.row:last-child{
border-bottom:0;
}

.label{
color:#666;
}

.value{
color:#ddd;
word-break:break-word;
}

table{
width:100%;
border-collapse:collapse;
font-size:9px;
}

th,td{
padding:8px;
border-bottom:1px solid #222;
text-align:left;
vertical-align:top;
}

th{
color:#777;
}

button{
border:1px solid #303030;
background:#171717;
color:#ddd;
border-radius:7px;
padding:9px 12px;
margin-bottom:8px;
}

.ok{
color:#63d18a;
}

</style>

</head>

<body>

<div class="app">

<div class="header">

<div class="title">
IP ANALYTICS ENGINE
</div>

<div
class="count"
id="count">
0 kayıt
</div>

</div>

<div class="card">

<div class="row">
<div class="label">Durum</div>
<div class="value ok">
İzinli analitik
</div>
</div>

<div class="row">
<div class="label">Amaç</div>
<div class="value">
Ziyaret / tıklama ölçümü
</div>
</div>

</div>

<button onclick="loadLogs()">
Yenile
</button>

<button onclick="saveJSON()">
JSON Kaydet
</button>

<div class="card">

<table>

<thead>

<tr>
<th>ID</th>
<th>Zaman</th>
<th>IP</th>
<th>REF</th>
<th>Browser</th>
</tr>

</thead>

<tbody id="logs">
<tr>
<td colspan="5">
Yükleniyor...
</td>
</tr>
</tbody>

</table>

</div>

</div>

<script>

let logs=[];

async function loadLogs(){

const r =
await fetch(
"/api/logs",
{
cache:"no-store"
}
);

logs =
await r.json();

document
.getElementById("count")
.textContent =
logs.length +
" kayıt";

const tbody =
document
.getElementById("logs");

tbody.innerHTML="";

for(const x of logs){

const tr =
document.createElement("tr");

const browser =
(x.user_agent || "")
.substring(0,80);

tr.innerHTML=`
<td>${escapeHtml(x.id)}</td>
<td>${escapeHtml(x.timestamp)}</td>
<td>${escapeHtml(x.ip)}</td>
<td>${escapeHtml(x.ref)}</td>
<td>${escapeHtml(browser)}</td>
`;

tbody.appendChild(tr);

}

}

function escapeHtml(x){

return String(x ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function saveJSON(){

const blob =
new Blob(
[
JSON.stringify(
logs,
null,
2
)
],
{
type:
"application/json"
}
);

const a =
document.createElement("a");

a.href =
URL.createObjectURL(blob);

a.download =
"analytics-report.json";

a.click();

}

loadLogs();

</script>

</body>
</html>
