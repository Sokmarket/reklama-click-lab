<!doctype html>
<html lang="tr">

<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1">

<title>IP Analytics Report</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
padding:12px;
background:#080808;
color:#eee;
font-family:
Arial,
sans-serif;
}

.app{
max-width:760px;
margin:auto;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
padding:8px 3px 12px;
}

.title{
font-size:14px;
font-weight:800;
}

.count{
font-size:10px;
color:#777;
}

.card{
background:#111;
border:1px solid #242424;
border-radius:13px;
overflow:hidden;
margin-bottom:8px;
}

.section{
padding:10px;
background:#161616;
font-size:10px;
font-weight:800;
letter-spacing:.5px;
}

.row{
display:grid;
grid-template-columns:100px 1fr;
border-top:1px solid #202020;
padding:9px;
font-size:9px;
}

.label{
color:#666;
}

.value{
color:#ddd;
word-break:break-word;
}

button{
border:1px solid #303030;
background:#151515;
color:#ddd;
border-radius:7px;
padding:9px 12px;
margin:0 4px 8px 0;
}

table{
width:100%;
border-collapse:collapse;
font-size:8px;
}

th,
td{
padding:8px;
border-bottom:1px solid #222;
text-align:left;
vertical-align:top;
}

th{
color:#666;
}

.ok{
color:#62d28b;
}

</style>

</head>

<body>

<div class="app">

<div class="header">

<div class="title">
IP OSINT ENGINE
</div>

<div
id="count"
class="count">
0 kayıt
</div>

</div>

<div class="card">

<div class="section">
SYSTEM
</div>

<div class="row">
<div class="label">Status</div>
<div class="value ok">
Consent-based analytics
</div>
</div>

<div class="row">
<div class="label">Storage</div>
<div class="value">
Local SQLite
</div>
</div>

<div class="row">
<div class="label">Limit</div>
<div class="value">
500 latest records
</div>
</div>

</div>

<button onclick="loadLogs()">
Yenile
</button>

<button onclick="saveJSON()">
JSON Kaydet
</button>

<div class="card">

<div class="section">
VISITS
</div>

<table>

<thead>

<tr>
<th>ID</th>
<th>TIME</th>
<th>IP</th>
<th>REF</th>
<th>UA</th>
</tr>

</thead>

<tbody id="logs">

<tr>
<td colspan="5">
Yükleniyor...
</td>
</tr>

</tbody>

</table>

</div>

</div>

<script>

let logs=[];

function esc(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

async function loadLogs(){

try{

const response =
await fetch(
"/api/logs",
{
cache:"no-store"
}
);

if(!response.ok){
throw new Error(
"HTTP " +
response.status
);
}

logs =
await response.json();

document
.getElementById("count")
.textContent =
logs.length +
" kayıt";

const tbody =
document
.getElementById("logs");

tbody.innerHTML="";

if(!logs.length){

tbody.innerHTML =
"<tr><td colspan='5'>Henüz kayıt yok.</td></tr>";

return;

}

for(const row of logs){

const tr =
document.createElement("tr");

tr.innerHTML =
"<td>" + esc(row.id) + "</td>" +
"<td>" + esc(row.timestamp) + "</td>" +
"<td>" + esc(row.ip) + "</td>" +
"<td>" + esc(row.ref) + "</td>" +
"<td>" +
esc(
(row.user_agent || "")
.substring(0,70)
) +
"</td>";

tbody.appendChild(tr);

}

}catch(error){

document
.getElementById("logs")
.innerHTML =
"<tr><td colspan='5'>" +
"Rapor alınamadı: " +
esc(error.message) +
"</td></tr>";

}

}

function saveJSON(){

const blob =
new Blob(
[
JSON.stringify(
logs,
null,
2
)
],
{
type:
"application/json"
}
);

const a =
document.createElement("a");

const objectURL =
URL.createObjectURL(blob);

a.href=objectURL;
a.download="analytics-report.json";

document.body.appendChild(a);

a.click();

a.remove();

setTimeout(
()=>{
URL.revokeObjectURL(
objectURL
);
},
1000
);

}

loadLogs();

setInterval(
loadLogs,
10000
);

</script>

</body>
</html>
