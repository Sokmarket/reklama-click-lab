<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080c16">
<title>Reklama Click Lab — Rapor</title>

<style>
:root{
 --bg:#080c16;
 --panel:#111827;
 --panel2:#172033;
 --text:#f4f7fb;
 --muted:#98a2b3;
 --line:#293449;
 --accent:#7c9cff;
 --ok:#42d392;
}

*{box-sizing:border-box}

body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family:system-ui,-apple-system,Segoe UI,sans-serif;
}

main{
 max-width:1500px;
 margin:auto;
 padding:20px;
}

header{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:15px;
 margin-bottom:20px;
}

h1{
 margin:0;
 font-size:28px;
}

.sub{
 color:var(--muted);
 margin-top:5px;
}

button{
 border:1px solid var(--line);
 background:var(--panel2);
 color:var(--text);
 border-radius:12px;
 padding:10px 15px;
 cursor:pointer;
}

.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:12px;
 margin-bottom:18px;
}

.stat{
 background:var(--panel);
 border:1px solid var(--line);
 border-radius:16px;
 padding:16px;
}

.stat small{
 display:block;
 color:var(--muted);
}

.stat strong{
 display:block;
 margin-top:7px;
 font-size:24px;
}

.status{
 padding:12px;
 border:1px solid var(--line);
 background:var(--panel);
 border-radius:12px;
 margin-bottom:18px;
}

.table{
 overflow:auto;
 border:1px solid var(--line);
 border-radius:16px;
 background:var(--panel);
}

table{
 width:100%;
 min-width:1550px;
 border-collapse:collapse;
}

th,td{
 padding:11px 9px;
 border-bottom:1px solid var(--line);
 text-align:left;
 font-size:13px;
 white-space:nowrap;
}

th{
 background:var(--panel2);
 position:sticky;
 top:0;
}

.ok{
 color:var(--ok);
 font-weight:700;
}

.muted{
 color:var(--muted);
}

@media(max-width:800px){
 .stats{
  grid-template-columns:repeat(2,1fr);
 }

 main{
  padding:12px;
 }

 header{
  align-items:flex-start;
  flex-direction:column;
 }
}
</style>
</head>

<body>

<main>

<header>
 <div>
  <h1>Reklama Click Lab</h1>
  <div class="sub">
   MaxMind GeoIP · Privacy-aware analytics
  </div>
 </div>

 <button onclick="load()">Yenile</button>
</header>

<div id="status" class="status">
 Rapor yükleniyor...
</div>

<section class="stats">

 <div class="stat">
  <small>Toplam kayıt</small>
  <strong id="total">—</strong>
 </div>

 <div class="stat">
  <small>MaxMind başarılı</small>
  <strong id="mm">—</strong>
 </div>

 <div class="stat">
  <small>Ülke</small>
  <strong id="country">—</strong>
 </div>

 <div class="stat">
  <small>Şehir</small>
  <strong id="city">—</strong>
 </div>

</section>

<div class="table">

<table>

<thead>
<tr>
<th>ID</th>
<th>Zaman</th>
<th>Ref</th>
<th>Event</th>
<th>Ülke</th>
<th>Kod</th>
<th>Kıta</th>
<th>Bölge</th>
<th>Şehir</th>
<th>Posta</th>
<th>Latitude</th>
<th>Longitude</th>
<th>Accuracy</th>
<th>Timezone</th>
<th>Network</th>
<th>ASN</th>
<th>Organization</th>
<th>MaxMind</th>
</tr>
</thead>

<tbody id="rows"></tbody>

</table>

</div>

</main>

<script>
"use strict";

const esc = v => {
 if(v === null || v === undefined || v === "")
  return "—";

 return String(v)
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
};

async function load(){

 const status=document.getElementById("status");

 status.textContent="Rapor yükleniyor...";

 try{

  const response=await fetch(
   "/api/report",
   {
    cache:"no-store",
    headers:{
     "Accept":"application/json"
    }
   }
  );

  if(!response.ok)
   throw new Error("HTTP "+response.status);

  const data=await response.json();

  if(data.ok !== true)
   throw new Error("API error");

  const rows=Array.isArray(data.rows)
   ? data.rows
   : [];

  document.getElementById("total").textContent=rows.length;

  document.getElementById("mm").textContent=
   rows.filter(
    r=>Number(r.maxmind_success)===1
   ).length;

  document.getElementById("country").textContent=
   new Set(
    rows
     .map(r=>r.country_code)
     .filter(Boolean)
   ).size;

  document.getElementById("city").textContent=
   new Set(
    rows
     .map(r=>r.city)
     .filter(Boolean)
   ).size;

  document.getElementById("rows").innerHTML=
   rows.map(r=>`

    <tr>
     <td>${esc(r.id)}</td>
     <td>${esc(r.timestamp)}</td>
     <td>${esc(r.ref)}</td>
     <td>${esc(r.event)}</td>
     <td>${esc(r.country)}</td>
     <td>${esc(r.country_code)}</td>
     <td>${esc(r.continent)}</td>
     <td>${esc(r.region)}</td>
     <td>${esc(r.city)}</td>
     <td>${esc(r.postal_code)}</td>
     <td>${esc(r.latitude)}</td>
     <td>${esc(r.longitude)}</td>
     <td>${r.accuracy_radius_km
       ? esc(r.accuracy_radius_km)+" km"
       : "—"}</td>
     <td>${esc(r.timezone)}</td>
     <td>${esc(r.network)}</td>
     <td>${esc(r.asn)}</td>
     <td>${esc(r.organization)}</td>
     <td>
       ${
        Number(r.maxmind_success)===1
        ? '<span class="ok">OK</span>'
        : '<span class="muted">—</span>'
       }
     </td>
    </tr>

   `).join("");

  status.innerHTML=
   '<span class="ok">●</span> '+
   'Canlı rapor hazır · Raw IP gösterilmez.';

 }catch(error){

  console.error(error);

  status.textContent=
   "Rapor yüklenemedi: "+error.message;
 }
}

load();
</script>

</body>
</html>
