<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>İNDİRİM KUPONU</title>

<meta property="og:type" content="website">
<meta property="og:title" content="İNDİRİM KUPONU">
<meta property="og:image"
      content="https://arzuoglumammad-star.github.io/reklama-click-lab/reklam.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:alt" content="İNDİRİM KUPONU">

<meta property="og:url"
      content="https://arzuoglumammad-star.github.io/reklama-click-lab/paylas/">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="İNDİRİM KUPONU">
<meta name="twitter:image"
      content="https://arzuoglumammad-star.github.io/reklama-click-lab/reklam.png">

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  min-height:100%;
}

body{
  background:#fff;
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}

.page{
  width:100%;
  min-height:100dvh;

  display:flex;
  justify-content:flex-start;
  align-items:center;
  flex-direction:column;

  padding:
    max(10px,env(safe-area-inset-top))
    10px
    max(14px,env(safe-area-inset-bottom));
}

.wrapper{
  width:100%;
  max-width:900px;
}

.image{
  display:block;
  width:100%;
  height:auto;

  border-radius:16px;

  object-fit:contain;
}

.coupon{
  display:flex;
  width:100%;

  min-height:64px;

  margin-top:10px;

  align-items:center;
  justify-content:center;

  border-radius:15px;

  background:#111;
  color:#fff;

  text-decoration:none;

  font-size:18px;
  font-weight:900;

  letter-spacing:.01em;

  box-shadow:0 7px 20px rgba(0,0,0,.20);
}

.coupon:active{
  transform:scale(.98);
}

@media(min-width:700px){
  .page{
    padding:30px;
  }

  .coupon{
    min-height:72px;
    font-size:21px;
  }
}
</style>
</head>

<body>

<main class="page">
  <div class="wrapper">

    <img
      class="image"
      src="../reklam.png"
      alt="İNDİRİM KUPONU"
      width="1200"
      height="1800"
      loading="eager"
      fetchpriority="high">

    <a
      class="coupon"
      href="https://www.sokmarket.com.tr/"
      target="_blank"
      rel="noopener noreferrer">
      İNDİRİM KUPONU
    </a>

  </div>
</main>

</body>
</html>
